{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Set Budget - FinanceTracker{% endblock %}
{% block page_title %}Set Budget{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary">Save Budget</button>
                        <a href="{% url 'budget_list' %}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
