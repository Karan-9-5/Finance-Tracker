{% extends 'base.html' %}

{% block title %}Logout - FinanceTracker{% endblock %}
{% block page_title %}Logout{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow text-center py-5">
            <div class="card-body">
                <i class="bi bi-box-arrow-right text-warning fs-1 mb-3"></i>
                <h3>Are you sure you want to sign out?</h3>
                <form method="post" action="{% url 'account_logout' %}">
                    {% csrf_token %}
                    {% if redirect_field_value %}
                    <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}" />
                    {% endif %}
                    <button type="submit" class="btn btn-primary px-5 mt-3">Sign Out</button>
                    <div class="mt-3">
                        <a href="/" class="text-muted">Stay Logged In</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
